[package]
name = "esp32-canscope-bridge"
version = "0.1.0"
edition = "2021"
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
esp-idf-svc = { version = "0.51", features = ["binstart"] }
esp-idf-hal = "0.45"
esp-idf-sys = "0.36"
esp32-nimble = "0.11"
embedded-svc = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heapless = "0.8"
log = "0.4"

[build-dependencies]
embuild = "0.33"
