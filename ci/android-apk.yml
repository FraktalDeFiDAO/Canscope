# CI — build the Android APK on GitHub and publish it as a downloadable release asset
#
# Why this file lives here:
#   The token used to push this repository does not include GitHub's `workflow`
#   scope, so files cannot be written directly into `.github/workflows/`.
#
# One-time setup (2 minutes, in the GitHub web UI):
#   1. Open this file on GitHub and copy its workflow content (everything below
#      the "CUT HERE" line).
#   2. Go to the repo's **Actions** tab → **New workflow** → **set up a workflow yourself**.
#   3. Paste the copied content, keep the filename `android-apk.yml`, and commit.
#   4. In **Actions → Build Android APK**, click **Run workflow**.
#
# When the run finishes (a few minutes), the installable APK appears:
#   - as a build artifact on the workflow run page, and
#   - attached to the rolling pre-release:  Releases → tag `android-debug`
#   Direct link to the releases page:
#   https://github.com/FraktalDeFiDAO/Canscope/releases
#
# From then on, every push that touches `android/` rebuilds and re-attaches the APK.

# ============================ CUT HERE ============================
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canscope-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Attach APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: CANScope Android Debug APK
          body: |
            Automated debug build of the CANScope Android app.
            Install `app-debug.apk` on your phone (allow installs from unknown sources when prompted).
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
